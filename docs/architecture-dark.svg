<svg xmlns="http://www.w3.org/2000/svg" width="960" height="940" viewBox="0 0 960 940" role="img" aria-labelledby="title desc">
<title id="title">FYP-Research architecture</title>
<desc id="desc">iedb_dataset.csv is split 80/10/10 with seed 42. Branch A fine-tunes ESM-2 650M with gated MHC-peptide co-attention and attention pooling. Branch B threads sequences onto four RCSB MHC templates, builds physics-feature graphs and trains a GATv2 GNN with attention fusion across templates. extract_predictions.py writes both models' predictions; train_ensemble.py fits a Ridge and an MLP stack on the validation split and reports RMSE, R2, PCC and SCC on the held-out test split.</desc>
