name: esm_graph
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  # Core PyTorch (Stable 2.5.1 with CUDA 12.4 support)
  - pytorch=2.5.1
  - pytorch-cuda=12.4
  - torchaudio=2.5.1
  - torchvision=0.20.1
  
  # Scientific computing
  - numpy<2.0
  - pandas
  - scipy
  
  # Bio-specific
  - biopython
  - rdkit
  
  # Pip dependencies for PyG
  - pip:
    - -f https://data.pyg.org/whl/torch-2.5.1+cu124.html
    - torch-geometric
    # Install optimized scatter/sparse wheels from the official PyG wheel index.
    - pyg_lib
    - torch_scatter
    - torch_sparse
    - torch_cluster
    - torch_spline_conv